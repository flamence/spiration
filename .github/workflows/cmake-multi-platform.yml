name: CMake 跨平台构建

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'common/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'common/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - '.github/workflows/**'
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            iwr -useb get.scoop.sh -outfile 'install.ps1'
            .\install.ps1 -RunAsAdmin
            scoop update
            scoop bucket add extras
            scoop install nsis
          elif [ "${{ runner.os }}" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libssl-dev libx11-dev libgl1-mesa-dev libfreetype-dev libxcb1-dev libxcb-randr0-dev
          fi

      - name: 设置复用变量
        id: pre-strings
        shell: bash
        run: |
          echo "build-output-dir=$GITHUB_WORKSPACE/build" >> "$GITHUB_OUTPUT"

      - name: 配置 CMake
        shell: bash
        run: >
          cmake -B "${{ steps.pre-strings.outputs.build-output-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S "$GITHUB_WORKSPACE"
          -G Ninja

      - name: 编译项目
        run: cmake --build "${{ steps.pre-strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} --target package

      - name: 设置复用变量
        id: post-strings
        shell: bash
        run: |
          PKG_DIR="$GITHUB_WORKSPACE/build/pkg"
          case "${{ runner.os }}" in
            Windows) SUFFIX="exe" ;;
            macOS)   SUFFIX="dmg" ;;
            Linux)   SUFFIX="deb" ;;
          esac
          PACKAGE_FILE=$(find "$PKG_DIR" -maxdepth 1 -type f -name "spiration-v*.${SUFFIX}" | head -n 1)
          if [ -z "$PACKAGE_FILE" ]; then
            exit 1
          fi
          echo "archive-path=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: 上传工件
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.post-strings.outputs.archive-path }}

      - name: 上传到 GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.post-strings.outputs.archive-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
