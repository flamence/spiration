name: CMake 跨平台构建

on:
  push:
    branches: [ "gui" ]
  pull_request:
    branches: [ "gui" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v6

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libfreetype-dev libxcb1-dev libxcb-randr0-dev

      - name: 设置复用变量
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            FILE_EXT=".zip"
          else
            VERSION="$(git rev-parse --short HEAD)"
            FILE_EXT=".tar.gz"
          fi
          echo "archive-name=spiration-$VERSION-${{ matrix.os }}$FILE_EXT" >> "$GITHUB_OUTPUT"

      - name: 配置 CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: 编译项目
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: 运行测试
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: 打包
        shell: bash
        run: |
          ARCHIVE="${{ steps.strings.outputs.archive-name }}"
          BUILD_DIR="${{ steps.strings.outputs.build-output-dir }}"
          cd "$BUILD_DIR/bin"
          if [[ "$ARCHIVE" == *.zip ]]; then
            if [ "${{ runner.os }}" == "Windows" ]; then
              7z a -tzip "${{ github.workspace }}/$ARCHIVE" * -r
            else
              zip -r "${{ github.workspace }}/$ARCHIVE" *
            fi
          else
            tar -czf "${{ github.workspace }}/$ARCHIVE" *
          fi
          cd "${{ github.workspace }}"

      - name: 上传工件
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.strings.outputs.archive-name }}
          path: ${{ github.workspace }}/${{ steps.strings.outputs.archive-name }}
      
      - name: 上传到 GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} "${{ steps.strings.outputs.archive-name }}" --repo ${{ github.repository }}