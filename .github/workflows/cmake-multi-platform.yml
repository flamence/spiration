name: CMake 跨平台构建

on:
  push:
    branches: [ "gui" ]
  pull_request:
    branches: [ "gui" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v6

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libfreetype-dev libxcb1-dev libxcb-randr0-dev

      - name: 设置复用变量
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: 配置 CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: 编译项目
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: 运行测试
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: 设置版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包
        shell: bash
        run: |
          BIN_DIR="${{ steps.strings.outputs.build-output-dir }}/bin"
          ARCHIVE_NAME="spiration-${{ steps.version.outputs.version }}-${{ matrix.os }}.zip"
          if [ "${{ runner.os }}" == "Windows" ]; then
            cd "$BIN_DIR"
            7z a -tzip "${{ github.workspace }}/$ARCHIVE_NAME" "*" -r
            cd "${{ github.workspace }}"
          else
            cd "$BIN_DIR"
            zip -r "${{ github.workspace }}/$ARCHIVE_NAME" . -r
            cd "${{ github.workspace }}"
          fi
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: spiration-${{ matrix.os }}
          path: ${{ env.ARCHIVE_NAME }}
      
      - name: 上传到 GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} "${{ env.ARCHIVE_NAME }}" --repo ${{ github.repository }}