name: Build

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'common/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - 'ohos/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'common/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - 'ohos/**'
      - '.github/workflows/**'
  release:
    types: [ published ]

jobs:
  detect-changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      os-matrix: ${{ steps.set-matrix.outputs.os-matrix }}
      run-harmonyos: ${{ steps.set-matrix.outputs.run-harmonyos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            CMakeLists.txt
            cmake/**
            common/**
            windows/**
            linux/**
            macos/**
            ohos/**
            .github/workflows/**

      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo 'os-matrix=["ubuntu-latest","ubuntu-24.04-arm","windows-latest","windows-11-vs2026-arm","macos-latest","macos-26-intel"]' >> $GITHUB_OUTPUT
            echo 'run-harmonyos=true' >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES="${{ steps.changed-files.outputs.all_modified_files }}"

          HAS_COMMON=false
          HAS_WINDOWS=false
          HAS_LINUX=false
          HAS_MACOS=false
          HAS_OHOS=false

          for file in $CHANGED_FILES; do
            case "$file" in
              CMakeLists.txt|cmake/*|common/*|.github/workflows/*)
                HAS_COMMON=true
                ;;
              windows/*)
                HAS_WINDOWS=true
                ;;
              linux/*)
                HAS_LINUX=true
                ;;
              macos/*)
                HAS_MACOS=true
                ;;
              ohos/*)
                HAS_OHOS=true
                ;;
            esac
          done

          if [ "$HAS_COMMON" = true ]; then
            OS_JSON='["ubuntu-latest","ubuntu-24.04-arm","windows-latest","windows-11-vs2026-arm","macos-latest","macos-26-intel"]'
          else
            OS_ARRAY=()
            [ "$HAS_WINDOWS" = true ] && OS_ARRAY+=("windows-latest" "windows-11-vs2026-arm")
            [ "$HAS_LINUX" = true ] && OS_ARRAY+=("ubuntu-latest" "ubuntu-24.04-arm")
            [ "$HAS_MACOS" = true ] && OS_ARRAY+=("macos-latest" "macos-26-intel")
            if [ ${#OS_ARRAY[@]} -eq 0 ]; then
              OS_ARRAY=()
            fi
            OS_JSON=$(printf '%s\n' "${OS_ARRAY[@]}" | jq -R . | jq -c -s .)
          fi

          echo "os-matrix=$OS_JSON" >> $GITHUB_OUTPUT
          if [ "$HAS_COMMON" = true ] || [ "$HAS_OHOS" = true ]; then
            echo 'run-harmonyos=true' >> $GITHUB_OUTPUT
          else
            echo 'run-harmonyos=false' >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    permissions:
      contents: write
    if: fromJSON(needs.detect-changes.outputs.os-matrix) != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect-changes.outputs.os-matrix) }}
        build_type: [ Release ]
        c_compiler: [ clang ]
        cpp_compiler: [ clang++ ]
        generator: [ Ninja ]
    steps:
      - uses: actions/checkout@v7

      - shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            dotnet tool install --global wix --version 4.0.4
            wix extension add --global WixToolset.UI.wixext/4.0.4
          elif [ "${{ runner.os }}" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libx11-dev libgl1-mesa-dev libfreetype-dev libxcb1-dev libxcb-randr0-dev
          fi

      - id: pre-strings
        shell: bash
        run: |
          echo "build-output-dir=$GITHUB_WORKSPACE/build" >> "$GITHUB_OUTPUT"

      - shell: bash
        run: >
          cmake -B "${{ steps.pre-strings.outputs.build-output-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S "$GITHUB_WORKSPACE"
          -G ${{ matrix.generator }}

      - run: cmake --build "${{ steps.pre-strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} --target package

      - id: post-strings
        shell: bash
        run: |
          PKG_DIR="$GITHUB_WORKSPACE/build/pkg"
          case "${{ runner.os }}" in
            Windows) SUFFIX="msi" ;;
            macOS)   SUFFIX="dmg" ;;
            Linux)   SUFFIX="deb" ;;
          esac
          PACKAGE_FILE=$(find "$PKG_DIR" -maxdepth 1 -type f -name "*.${SUFFIX}" | head -n 1)
          if [ -z "$PACKAGE_FILE" ]; then
            exit 1
          fi
          echo "archive-path=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.post-strings.outputs.archive-path }}
          archive: false

      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.post-strings.outputs.archive-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-harmonyos:
    needs: detect-changes
    if: needs.detect-changes.outputs.run-harmonyos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: strings
        shell: bash
        run: |
          WORKSPACE="$GITHUB_WORKSPACE/ohos"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "build-hap=$WORKSPACE/entry/build/default/outputs/default/entry-default-unsigned.hap" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_SHA:0:7}"
          fi
          echo "archive-name=spiration-$VERSION-harmonyos" >> "$GITHUB_OUTPUT"

      - uses: chen-linkai/build-hap@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          workspace: ${{ steps.strings.outputs.workspace }}

      - if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.strings.outputs.archive-name }}
          path: ${{ steps.strings.outputs.build-hap }}
          archive: false

      - if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} "${{ steps.strings.outputs.build-hap }}#${{ steps.strings.outputs.archive-name }}.hap" --repo ${{ github.repository }}
