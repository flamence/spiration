name: CMake 跨平台构建

on:
  push:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'common/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'common/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - '.github/workflows/**'
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v6

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libx11-dev libgl1-mesa-dev libfreetype-dev libxcb1-dev libxcb-randr0-dev

      - name: 设置复用变量
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            echo "build-bin-dir=${{ github.workspace }}/build/bin/${{ matrix.build_type }}" >> "$GITHUB_OUTPUT"
          else
            echo "build-bin-dir=${{ github.workspace }}/build/bin" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          OS_NAME="$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          echo "archive-name=spiration-$VERSION-$OS_NAME" >> "$GITHUB_OUTPUT"

      - name: 配置 CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: 编译项目
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: 运行测试
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: 上传工件
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.strings.outputs.archive-name }}
          path: ${{ steps.strings.outputs.build-bin-dir }}

      - name: 上传到 GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ steps.strings.outputs.build-bin-dir }}"
          tar -czf "${{ steps.strings.outputs.archive-name }}" *
          gh release upload ${{ github.event.release.tag_name }} "${{ steps.strings.outputs.archive-name }}" --repo ${{ github.repository }}